<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{title}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,600;1,14..32,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root {
    --bg: #fbfcfe;
    --surface: #eef4fb;
    --text: #1b2433;
    --muted: #5d6b80;
    --rule: #d8e2ee;
    --accent: #2f8cff;
    --accent-ink: #1667cf;
    --warm: #ffb547;
    --hero-bg: #0a1a2f;
    --hero-text: #eaf2f8;
    --hero-muted: #8fb3d9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a1a2f;
      --surface: #13294a;
      --text: #dce6f0;
      --muted: #8a96a8;
      --rule: #213a5e;
      --accent: #5fb0ff;
      --accent-ink: #8cc6ff;
      --hero-bg: #061223;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a1a2f;
    --surface: #13294a;
    --text: #dce6f0;
    --muted: #8a96a8;
    --rule: #213a5e;
    --accent: #5fb0ff;
    --accent-ink: #8cc6ff;
    --hero-bg: #061223;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 1.5rem; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 1.0625rem/1.75 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-optical-sizing: auto;
    letter-spacing: -.003em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-ink); text-decoration-thickness: 1px; text-underline-offset: 2px; }

  /* Hero */
  header.hero {
    background:
      radial-gradient(1200px 400px at 80% -10%, rgba(47,140,255,.35), transparent 60%),
      radial-gradient(600px 300px at 10% 120%, rgba(255,181,71,.18), transparent 60%),
      var(--hero-bg);
    color: var(--hero-text);
    padding: 5rem 1rem 4rem;
  }
  .hero-inner { max-width: 60rem; margin: 0 auto; }
  .eyebrow {
    font: 500 .8rem/1 "IBM Plex Mono", monospace;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--warm);
    display: flex; align-items: center; gap: .6rem;
  }
  .eyebrow svg { width: 14px; height: 18px; }
  h1 {
    font: 700 clamp(2.6rem, 7vw, 4.5rem)/1.05 Poppins, sans-serif;
    letter-spacing: -.02em;
    margin: 1rem 0 .75rem;
  }
  .subtitle {
    font: 500 clamp(1.15rem, 2.6vw, 1.5rem)/1.4 Poppins, sans-serif;
    color: var(--hero-muted);
    max-width: 38rem; margin: 0;
  }

  /* Layout */
  .layout {
    max-width: 60rem; margin: 0 auto; padding: 3rem 1rem 5rem;
    display: grid; grid-template-columns: 12rem minmax(0, 1fr); column-gap: 3.5rem;
    grid-template-areas: "toc film" "toc article";
  }
  nav.toc { grid-area: toc; position: sticky; top: 1.5rem; align-self: start; font: 400 .85rem/1.4 Poppins, sans-serif; }
  nav.toc h2 {
    font: 500 .72rem/1 "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 .9rem;
  }
  nav.toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--rule); }
  nav.toc li a {
    display: block; padding: .3rem 0 .3rem .9rem; margin-left: -1px;
    color: var(--muted); text-decoration: none; border-left: 2px solid transparent;
  }
  nav.toc li.toc-3 a { padding-left: 1.7rem; font-size: .8rem; }
  nav.toc li a:hover { color: var(--text); }
  nav.toc li a.active { color: var(--accent-ink); border-left-color: var(--accent); }

  /* Article */
  article { grid-area: article; max-width: 42rem; }
  article h2, article h3 { font-family: Poppins, sans-serif; line-height: 1.25; position: relative; }
  article h2 { font-size: 1.55rem; font-weight: 600; margin: 3rem 0 1rem; }
  article h3 { font-size: 1.15rem; font-weight: 600; margin: 2rem 0 .6rem; }
  .anchor {
    position: absolute; left: -1.2em; color: var(--rule); text-decoration: none; opacity: 0;
    transition: opacity .15s;
  }
  h2:hover .anchor, h3:hover .anchor { opacity: 1; }
  article p { margin: 0 0 1.1rem; }
  article ul, article ol { padding-left: 1.3rem; margin: 0 0 1.2rem; }
  article li { margin: .45rem 0; }
  article li::marker { color: var(--accent); }
  article strong { font-weight: 600; }

  /* Film: the figure keeps its 16:9 slot so the page doesn't reflow in theatre mode */
  .film { grid-area: film; max-width: 42rem; margin: 0 0 2.5rem; aspect-ratio: 16 / 9; }
  .film video {
    display: block; width: 100%; height: 100%;
    background: var(--hero-bg); border-radius: 12px;
    box-shadow: 0 1px 2px rgba(10,26,47,.12), 0 12px 32px -8px rgba(10,26,47,.35);
  }

  /* Theatre mode: entered on play; the video floats centered over a dimmed page */
  html.theatre { overflow: hidden; }
  html.theatre .film video {
    --w: min(94vw, calc((100vh - 7rem) * 16 / 9));
    position: fixed; inset: 0; margin: auto; z-index: 101;
    width: var(--w); height: calc(var(--w) * 9 / 16);
    border-radius: 8px; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 30px 90px -20px rgba(0,0,0,.8);
  }
  .theatre-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(3, 8, 16, .92);
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  html.theatre .theatre-backdrop { opacity: 1; pointer-events: auto; }
  .theatre-close {
    position: absolute; top: 1rem; right: 1rem;
    display: flex; align-items: center; gap: .5rem;
    padding: .5rem .8rem; border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
    background: rgba(255,255,255,.06); color: #eaf2f8; cursor: pointer;
    font: 500 .75rem/1 "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase;
  }
  .theatre-close:hover { background: rgba(255,255,255,.14); }
  .theatre-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .theatre-backdrop { transition: none; } }

  .abstract {
    background: var(--surface);
    border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding: 1.4rem 1.6rem .4rem;
    font-size: 1.1rem;
  }
  .abstract h2 {
    font: 500 .75rem/1 "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 .9rem;
  }
  .abstract .anchor { display: none; }

  .cite { font-size: .85em; text-decoration: none; font-variant-numeric: tabular-nums; }
  .ref {
    display: grid; grid-template-columns: 2.4rem 1fr; gap: .2rem;
    font-size: .95rem; line-height: 1.55; color: var(--muted);
    overflow-wrap: anywhere;
  }
  .ref-num { font-family: "IBM Plex Mono", monospace; color: var(--accent-ink); }
  .ref:target { background: var(--surface); border-radius: 6px; }

  .katex { font-size: 1.05em; }
  .katex-display { overflow-x: auto; overflow-y: hidden; }


  @media (max-width: 52rem) {
    .layout { grid-template-columns: 1fr; grid-template-areas: "film" "toc" "article"; padding-top: 2rem; }
    nav.toc { position: static; margin-bottom: 1rem; }
    header.hero { padding: 3.5rem 1rem 3rem; }
    .anchor { display: none; }
  }
  @media print {
    header.hero { background: none; color: #000; padding: 1rem 0; }
    .subtitle { color: #333; }
    nav.toc, .film { display: none; }
    .layout { display: block; padding: 0; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">
      <svg viewBox="0 0 14 18" aria-hidden="true"><path d="M7 0C7 0 0 8.2 0 11.5A7 7 0 0 0 14 11.5C14 8.2 7 0 7 0Z" fill="currentColor"/></svg>
      Whitepaper
    </div>
    <h1>{{heading}}</h1>
    <p class="subtitle">{{subtitle}}</p>
  </div>
</header>

<div class="layout">
{{video}}
  <nav class="toc" aria-label="Contents">
    <h2>Contents</h2>
    <ol>
{{toc}}
    </ol>
  </nav>
  <article>
{{body}}
  </article>
</div>

<script>
  // Highlight the current section in the table of contents.
  const links = new Map([...document.querySelectorAll('nav.toc a')].map((a) => [a.hash.slice(1), a]));
  const obs = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      links.forEach((a) => a.classList.remove('active'));
      links.get(e.target.id)?.classList.add('active');
    }
  }, { rootMargin: '0px 0px -70% 0px' });
  document.querySelectorAll('article h2[id], article h3[id]').forEach((h) => obs.observe(h));

  // Theatre mode: playing the film dims the page and enlarges the video.
  const film = document.querySelector('.film video');
  if (film) {
    const root = document.documentElement;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const backdrop = document.createElement('div');
    backdrop.className = 'theatre-backdrop';
    backdrop.innerHTML = '<button class="theatre-close" type="button" aria-label="Exit theatre mode">Close <span aria-hidden="true">✕</span></button>';
    document.body.append(backdrop);

    // FLIP: animate the video from where it was to where the class change puts it.
    const morph = (change) => {
      const a = film.getBoundingClientRect();
      change();
      const b = film.getBoundingClientRect();
      if (reduceMotion.matches || !b.width) return;
      film.animate([
        { transformOrigin: '0 0', transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width})` },
        { transformOrigin: '0 0', transform: 'none' },
      ], { duration: 420, easing: 'cubic-bezier(.2, .8, .2, 1)' });
    };
    const inTheatre = () => root.classList.contains('theatre');
    const enter = () => {
      if (inTheatre() || document.fullscreenElement) return;
      morph(() => root.classList.add('theatre'));
    };
    const exit = () => {
      if (!inTheatre()) return;
      morph(() => root.classList.remove('theatre'));
    };

    film.addEventListener('play', enter);
    film.addEventListener('ended', exit);
    backdrop.addEventListener('click', exit);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.fullscreenElement) exit(); });
  }
</script>
</body>
</html>
