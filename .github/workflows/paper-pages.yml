name: Deploy whitepaper to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/paper-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Only install the paper workspace; --ignore-scripts skips the videos
      # package's Playwright browser download.
      - run: npm ci --workspace paper --ignore-scripts
      - run: npm run build --workspace paper
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: paper/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
